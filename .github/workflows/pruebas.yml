# Pruebas automáticas del reproductor y del plugin: en cada push a master, en cada PR
# y a mano (Actions → Pruebas → Run workflow, para una rama sin PR).
# Tres capas (ver "Pruebas" en el README):
#   1. unitarias (node:test, sin navegador): candado, subtítulos, firma de Bunny (espejo),
#      el adaptador de Chromecast
#   2. PHP: las funciones puras de mod/ivplayer/lib.php, leídas del archivo real
#   3. navegador: el bundle compilado en Chrome headless, con un video HLS generado acá
#      con ffmpeg (no depende de la red ni de ningún video de Hub Education)
# No publica nada: el ZIP y el configurador los arma build-plugin.yml.
# Si este Chrome no trae HLS nativo, las pruebas del motor nativo (el camino del iPhone)
# se saltean y el job queda VERDE con una advertencia ("salteadas en parte") arriba del
# log: mirarla. No se hace fallar porque depende de la versión de Chrome del runner.
name: Pruebas

on:
  # Sólo master: con `push` en todas las ramas, cada PR de una rama de este repo
  # corría dos veces (el push y el PR van en grupos de concurrencia distintos).
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Unitarias
        run: npm run test:unit

      - name: PHP (lib.php real)
        run: |
          php -v
          # Las que usa la normalización de subtítulos (si falta una, correr.php sale con 2).
          php -m | grep -Ei '^(mbstring|iconv)$' || true
          npm run test:php

      # El runner trae ffmpeg; si alguna imagen no lo tuviera, se instala acá (sólo en CI).
      - name: Video de prueba (ffmpeg)
        run: |
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          ffmpeg -hide_banner -version | head -1
          npm run video-prueba

      - name: Navegador (Chrome headless)
        env:
          # Si falta Chrome o el video, que falle en vez de saltearse en silencio.
          IVP_EXIGIR_NAVEGADOR: '1'
        run: |
          google-chrome --version
          npm run test:navegador

      - name: Capturas de las pruebas de navegador que fallaron
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-navegador
          path: tests/navegador/.salida/
          if-no-files-found: ignore
          retention-days: 7
