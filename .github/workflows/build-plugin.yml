name: Build Moodle Plugin

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin ZIP
        run: node scripts/build-plugin.js

      - name: Generate version tag
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d')-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Plugin ${{ steps.version.outputs.tag }}
          body: |
            ## mod_ivplayer para Moodle

            **Instalación:**
            1. Descargá `mod_ivplayer.zip`
            2. En Moodle: Administración del Sitio → Plugins → Instalar plugins
            3. Subí el ZIP y confirmá la instalación

            **Actualización:**
            1. Descargá `mod_ivplayer.zip`
            2. En Moodle: Administración del Sitio → Plugins → Instalar plugins
            3. Subí el ZIP — Moodle detecta que es una actualización y la aplica
          files: dist/mod_ivplayer.zip
          make_latest: true
