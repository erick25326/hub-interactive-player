<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Prueba · video nativo (HLS)</title>
  <!--
    Banco de pruebas del reproductor con <video> nativo + hls.js (nativePlayer.js).
    No entra al build (vite build sólo emite index.html). Abrir con `npx vite`:
      http://localhost:5180/prueba-nativo.html
    Por defecto usa un HLS público de prueba (Mux, Big Buck Bunny, varias
    calidades). Para probar un video de Bunny: ?src=<URL del playlist.m3u8>
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { width: 100%; height: 100%; }
    body { background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  </style>
  <script>
    const q = new URLSearchParams(location.search);
    window.PLAYER_CONFIG = {
      title: "Prueba · video nativo",
      videoUrl: q.get("src") || "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
      interactions: [
        { id: "note-prueba", type: "note", time: 8,
          data: { title: "Nota de prueba", text: "El video tiene que **frenar** acá y seguir al tocar Continuar." } },
        { id: "label-prueba", type: "label", time: 12, duration: 8,
          data: { text: "Etiqueta", definition: "No frena el video. Al tocarla sí pausa, y al cerrarla sigue.", x: 5, y: 15 } },
        { id: "tf-prueba", type: "true-false", time: 25,
          data: { statement: "Este video se reproduce con un <video> propio, sin Vimeo.", correct: true,
                  explanation: "Sí: lo maneja nativePlayer.js con hls.js (o el HLS nativo en iPhone)." } },
      ],
    };
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
